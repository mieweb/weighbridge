# Reference workflow: gate on PRs with sparkline trend + Δ-vs-main sticky
# comment, weigh-in history and badges on a `weigh-ins` branch for main pushes,
# and a weigh ticket appended to release notes. Copy into
# .github/workflows/weighbridge.yml and adjust the build steps.
name: Weighbridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write        # weigh-ins branch push (main/release only)
  actions: read          # baseline artifact download (PRs)
  pull-requests: write   # sticky weigh-in comment (PRs)

jobs:
  weighbridge:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-node@v5
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    # PRs: main's latest report becomes the baseline (Δ column) and the
    # weigh-ins history feeds the sparkline trend column.
    - name: Fetch baseline and history
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run_id=$(gh run list --workflow weighbridge.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
        if [ -n "$run_id" ]; then
          gh run download "$run_id" -n weighbridge-report -D /tmp/weighbridge-base \
            && cp /tmp/weighbridge-base/weighbridge-report.json weighbridge-baseline.json \
            && echo "baseline: main run $run_id" || echo "no baseline artifact on run $run_id"
        else
          echo "no successful main run yet — skipping baseline"
        fi
        git fetch -q --depth 1 origin weigh-ins 2>/dev/null \
          && git show FETCH_HEAD:weigh-ins.jsonl > weigh-ins.jsonl \
          && echo "history: $(wc -l < weigh-ins.jsonl) weigh-ins" \
          || echo "no weigh-ins history yet"

    - name: Weigh-in (curb weight limits)
      uses: mieweb/weighbridge@v1

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weighbridge-report
        path: weighbridge-report.json

    # PRs: sticky comment (created once, updated in place on later pushes).
    - name: Post weigh-in comment
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        [ -f weighbridge-summary.md ] || exit 0
        pr=${{ github.event.pull_request.number }}
        cid=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- weighbridge -->")) | .id' | head -n1)
        if [ -n "$cid" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@weighbridge-summary.md > /dev/null
        else
          gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@weighbridge-summary.md > /dev/null
        fi

    # Main pushes + releases: append one weigh-in row to weigh-ins.jsonl and
    # refresh shields.io endpoint badges on the weigh-ins branch.
    - name: Record weigh-in and badges
      if: github.event_name == 'push' || github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        row=$(node -e "
          const r = JSON.parse(require('fs').readFileSync('weighbridge-report.json','utf8'));
          console.log(JSON.stringify({
            date: r.date,
            sha: process.env.GITHUB_SHA,
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF_NAME,
            metrics: Object.fromEntries(r.results.map(x => [x.metric, x.value])),
          }));
        ")
        dir=$(mktemp -d)
        git -C "$dir" init -q
        git -C "$dir" config user.name 'github-actions[bot]'
        git -C "$dir" config user.email 'github-actions[bot]@users.noreply.github.com'
        git -C "$dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if git -C "$dir" fetch -q --depth 1 origin weigh-ins; then
          git -C "$dir" checkout -q FETCH_HEAD
        fi
        echo "$row" >> "$dir/weigh-ins.jsonl"
        npx -y github:mieweb/weighbridge badges --out "$dir"
        git -C "$dir" add -A
        git -C "$dir" commit -q -m "weigh-in: ${GITHUB_SHA::7} (${GITHUB_EVENT_NAME} ${GITHUB_REF_NAME})"
        git -C "$dir" push -q origin HEAD:refs/heads/weigh-ins

    # Releases: append the weigh ticket to the release notes.
    - name: Stamp weigh ticket on release notes
      if: github.event_name == 'release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git fetch -q --depth 1 origin weigh-ins 2>/dev/null \
          && git show FETCH_HEAD:weigh-ins.jsonl > weigh-ins.jsonl || true
        npx -y github:mieweb/weighbridge ticket --ref "$GITHUB_REF_NAME" > /tmp/ticket.md
        gh release view "$GITHUB_REF_NAME" --json body --jq .body > /tmp/notes.md
        cat /tmp/ticket.md >> /tmp/notes.md
        gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
